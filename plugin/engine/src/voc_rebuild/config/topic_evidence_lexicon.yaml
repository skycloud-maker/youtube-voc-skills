    scope: "common"
    evidence_terms: ["사고싶은 맘이 없는", "사려 했", "사려햤", "생각이 접혔", "안사기로"]
    note: "구매·재구매를 하지 않겠다는 의사 표명. 가격 자체 평가는 가격/가성비, 브랜드·품질 신뢰 평가는 제조사 신뢰/품질을 우선하며 CEJ 결정·교체 단계와는 별도 축으로 판정한다."

