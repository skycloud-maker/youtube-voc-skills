version: "topic-evidence-lexicon-v0.9"
source: "VoC Topic taxonomy redesign v0.9 §6"
notes:
  - "Phase 0.5 moves taxonomy §6 evidence terms into YAML. E1 guard logic is Phase 1."
  - "가격/가성비 evidence_terms preserves taxonomy §6, while guard_terms preserves the pre-Phase-0.5 price_value_guard tokens exactly."

