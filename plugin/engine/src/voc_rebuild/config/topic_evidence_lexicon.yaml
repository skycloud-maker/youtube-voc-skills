    scope: "common"
    evidence_terms: []
    fallback_only: true
    note: "전용 어휘 없음. 구체 대상 언급이 하나도 없을 때만 사용하는 최후 라벨이며, 구체 라벨 어휘가 하나라도 발견되면 사용 금지."
